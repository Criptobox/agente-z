# .github/workflows/chat.yml
# Endpoint conversacional para el dashboard.
# El dashboard lo invoca vía repository_dispatch con { question, history }.
# Devuelve la respuesta como artifact (leída por el dashboard vía API).

name: chat

on:
  repository_dispatch:
    types: [chat]
  workflow_dispatch:
    inputs:
      question:
        description: 'Pregunta del usuario'
        required: true

permissions:
  contents: write
  models: read
  issues: write

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Determine question
        id: q
        run: |
          QUESTION="${{ github.event.client_payload.question || github.event.inputs.question }}"
          echo "question=$QUESTION" >> $GITHUB_OUTPUT
          echo "Pregunta: $QUESTION"

      - name: Run chat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          LOCALE: es
        run: |
          node src/chat.js --question="${{ steps.q.outputs.question }}" > /tmp/chat-response.txt 2>&1 || true
          # Extraer solo la respuesta (entre marcadores)
          sed -n '/---RESPONSE_START---/,/---RESPONSE_END---/p' /tmp/chat-response.txt | sed '1d;$d' > /tmp/chat-final.txt
          echo "Respuesta:"
          cat /tmp/chat-final.txt

      - name: Save response as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-response-${{ github.run_id }}
          path: /tmp/chat-final.txt
          retention-days: 1

      - name: Comment on issue if applicable
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.issue_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('/tmp/chat-final.txt', 'utf8').trim() || '(sin respuesta)';
            const question = '${{ steps.q.outputs.question }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.client_payload.issue_number }},
              body: `### 💬 Pregunta: ${question}\n\n${response}`
            });
