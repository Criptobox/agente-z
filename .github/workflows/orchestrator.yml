# .github/workflows/orchestrator.yml
# Se dispara al abrir/comentar un Issue con label "agent-task".
# Crea la tarea con Definition of Done y despacha al primer agente.

name: orchestrator

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número del Issue a procesar'
        required: true

# NOTA: los comentarios /approve los maneja EXCLUSIVAMENTE pr-approve.yml.
# Antes este workflow también escuchaba issue_comment y /approve se procesaba
# dos veces (handleApprove en paralelo, dispatch duplicado del agente).

permissions:
  contents: write
  issues: write
  models: read
  actions: write

concurrency:
  group: orchestrator-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent-task'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          EMBEDDINGS_MODEL: ${{ vars.EMBEDDINGS_MODEL }}
          BUDGET_DAILY_TOKENS: ${{ vars.BUDGET_DAILY_TOKENS }}
          LOCALE: es
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Havana' }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        run: node src/orchestrator.js

      - name: Commit task file
        run: |
          git config user.name  "agent-orchestrator"
          git config user.email "agent@bot"
          git add tasks/ memory/
          git diff --staged --quiet || git commit -m "orchestrator: tarea creada para issue #${{ github.event.issue.number || github.event.inputs.issue_number }}"
          git pull --rebase origin main || (echo "⚠ conflictos en pull rebase, abortando push" && git rebase --abort && exit 1)
          git push
