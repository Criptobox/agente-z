# .github/workflows/inventory-watch.yml
# Vigilancia diaria de inventarios entre repos.
# Compara productos de dos repos (configurados en variables) y notifica cambios.

name: inventory-watch

on:
  schedule:
    # 9 AM America/Havana = 1 PM UTC (EDT) / 2 PM UTC (EST)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      repo_a:
        description: 'Repo A (referencia, ej: axontech/axon-store)'
        required: false
      repo_b:
        description: 'Repo B (a comparar, ej: tiendamax/tiendamax-web)'
        required: false
      path_a:
        description: 'Path al archivo de productos en A (opcional)'
        required: false
      path_b:
        description: 'Path al archivo de productos en B (opcional)'
        required: false
      issue_number:
        description: 'Issue donde comentar (opcional, si vacío crea uno nuevo)'
        required: false

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: inventory-watch
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Determine repos to compare
        id: repos
        run: |
          REPO_A="${{ github.event.inputs.repo_a || vars.INVENTORY_REPO_A || '' }}"
          REPO_B="${{ github.event.inputs.repo_b || vars.INVENTORY_REPO_B || '' }}"
          PATH_A="${{ github.event.inputs.path_a || '' }}"
          PATH_B="${{ github.event.inputs.path_b || '' }}"
          ISSUE_NUM="${{ github.event.inputs.issue_number || '' }}"
          echo "repo_a=$REPO_A" >> $GITHUB_OUTPUT
          echo "repo_b=$REPO_B" >> $GITHUB_OUTPUT
          echo "path_a=$PATH_A" >> $GITHUB_OUTPUT
          echo "path_b=$PATH_B" >> $GITHUB_OUTPUT
          echo "issue=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "Comparando: $REPO_A vs $REPO_B"

      - name: Skip if no repos configured
        if: steps.repos.outputs.repo_a == '' || steps.repos.outputs.repo_b == ''
        run: |
          echo "⚠️ No hay repos configurados para comparar."
          echo "Configura las variables INVENTORY_REPO_A e INVENTORY_REPO_B en Settings → Actions → Variables."
          echo "Ejemplo:"
          echo "  INVENTORY_REPO_A = axontech/axon-store"
          echo "  INVENTORY_REPO_B = tiendamax/tiendamax-web"
          exit 0

      - name: Run inventory comparison
        if: steps.repos.outputs.repo_a != '' && steps.repos.outputs.repo_b != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          LOCALE: es
        run: |
          ARGS="--repoA=${{ steps.repos.outputs.repo_a }} --repoB=${{ steps.repos.outputs.repo_b }}"
          if [ -n "${{ steps.repos.outputs.path_a }}" ]; then
            ARGS="$ARGS --pathA=${{ steps.repos.outputs.path_a }}"
          fi
          if [ -n "${{ steps.repos.outputs.path_b }}" ]; then
            ARGS="$ARGS --pathB=${{ steps.repos.outputs.path_b }}"
          fi
          if [ -n "${{ steps.repos.outputs.issue }}" ]; then
            ARGS="$ARGS --issue=${{ steps.repos.outputs.issue }}"
          fi
          node src/inventory.js $ARGS

      - name: Commit memory
        if: success() && steps.repos.outputs.repo_a != ''
        run: |
          git config user.name  "agent-inventory"
          git config user.email "agent@bot"
          git add memory/
          git diff --staged --quiet || git commit -m "inventory: reporte ${{ steps.repos.outputs.repo_a }} vs ${{ steps.repos.outputs.repo_b }}"
          git pull --rebase origin main || (echo "⚠ conflictos en pull rebase" && git rebase --abort && exit 1)
          git push
