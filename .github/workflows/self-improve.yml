# .github/workflows/self-improve.yml
# Auto-mejora: lee su historial y abre PRs para cambiar agents/*.md.
# Cron semanal (domingo 4 AM hora local) + trigger manual.

name: self-improve

on:
  schedule:
    # Domingo 4 AM America/Havana = 8 AM UTC (EDT) / 9 AM UTC (EST)
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run self-improver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          LOCALE: es
        run: node src/agents/self_improver.js
