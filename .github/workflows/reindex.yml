# .github/workflows/reindex.yml
# Reconstrucción nocturna del índice + embeddings + staleness check + deploy a Pages.
# Cron diario a las 2 AM hora local.

name: reindex

on:
  schedule:
    # 2 AM America/Havana = 6 AM UTC (EDT) / 7 AM UTC (EST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar recálculo de embeddings (incluso existentes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  models: read
  pages: write
  id-token: write   # requerido por actions/deploy-pages@v4 para OIDC

jobs:
  # ─── Job 1: reindex + commit ───
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run reindex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS }}
          EMBEDDINGS_MODEL: ${{ vars.EMBEDDINGS_MODEL }}
          LOCALE: es
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          node src/reindex.js $FORCE

      - name: Commit
        run: |
          git config user.name  "agent-reindex"
          git config user.email "agent@bot"
          git add memory/
          git diff --staged --quiet || git commit -m "reindex: snapshot nocturno"
          git pull --rebase origin main || (echo "⚠ conflictos en pull rebase, abortando push" && git rebase --abort && exit 1)
          git push

  # ─── Job 2: deploy a GitHub Pages ───
  # Job separado con environment: github-pages (requerido por deploy-pages@v4)
  deploy:
    needs: reindex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main — el job 1 acaba de pushear el reindex; sin esto el checkout
      # usa el SHA original del evento y publica los datos de la víspera.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build dashboard artifact
        run: |
          mkdir -p ./_site
          # Copiar dashboard a la raíz del artifact
          cp -r ./dashboard/* ./_site/
          # Crear directorio data/ con memoria y tareas para que el dashboard pueda hacer fetch
          mkdir -p ./_site/data/memory ./_site/data/tasks
          # Copiar solo los JSON que el dashboard necesita (no los .md que pueden contener info sensible)
          [ -f ./memory/index.json ] && cp ./memory/index.json ./_site/data/memory/
          [ -f ./memory/stats.json ] && cp ./memory/stats.json ./_site/data/memory/
          [ -f ./memory/vectors.json ] && cp ./memory/vectors.json ./_site/data/memory/
          [ -f ./memory/diary/index.json ] && cp ./memory/diary/index.json ./_site/data/memory/diary-index.json
          [ -f ./memory/budget/index.json ] && cp ./memory/budget/index.json ./_site/data/memory/budget-index.json
          [ -d ./memory/diary ] && cp -r ./memory/diary ./_site/data/memory/diary 2>/dev/null || true
          [ -d ./memory/budget ] && cp -r ./memory/budget ./_site/data/memory/budget 2>/dev/null || true
          [ -f ./tasks/index.json ] && cp ./tasks/index.json ./_site/data/tasks/
          [ -d ./tasks ] && cp ./tasks/*.json ./_site/data/tasks/ 2>/dev/null || true
          # Listar contenido para debug
          echo "=== Contenido del artifact ==="
          find ./_site -type f | head -30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
