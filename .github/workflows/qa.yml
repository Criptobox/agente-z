name: qa

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'ID de la tarea'
        required: false
  schedule:
    - cron: '0 3 * * *'  # 3 AM diario

permissions:
  contents: write
  issues: write
  models: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run qa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ github.event.inputs.task_id || '' }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          LOCALE: es
        run: |
          if [ -n "$TASK_ID" ]; then
            node src/runner.js --agent=qa --task=$TASK_ID
          else
            echo "No task_id provided, running scheduled check"
            node src/agents/qa.js || echo "No standalone script, skipping"
          fi
      - name: Commit
        run: |
          git config user.name "agent-qa"
          git config user.email "agent@bot"
          git add memory/ tasks/
          git diff --staged --quiet || git commit -m "qa: check"
          git pull --rebase origin main || (git rebase --abort && exit 1)
          git push
