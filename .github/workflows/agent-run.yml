# .github/workflows/agent-run.yml
# Ejecuta UN turno de UN agente.
# Se dispara por repository_dispatch (lo manda orchestrator) o workflow_dispatch manual.

name: agent-run

on:
  repository_dispatch:
    types: [agent_run]
  workflow_dispatch:
    inputs:
      agent:
        description: 'Nombre del agente (code, research, test, security, ...)'
        required: true
      task_id:
        description: 'ID de la tarea (TASK-XXXX)'
        required: true

permissions:
  contents: write
  issues: write
  models: read
  actions: write

concurrency:
  group: agent-run-${{ github.event.client_payload.task_id || github.event.inputs.task_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determinar agente y tarea
        id: ctx
        run: |
          AGENT="${{ github.event.client_payload.agent || github.event.inputs.agent }}"
          TASK="${{ github.event.client_payload.task_id || github.event.inputs.task_id }}"
          echo "agent=$AGENT" >> $GITHUB_OUTPUT
          echo "task_id=$TASK" >> $GITHUB_OUTPUT
          echo "Agente: $AGENT | Tarea: $TASK"

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          AGENT: ${{ steps.ctx.outputs.agent }}
          TASK_ID: ${{ steps.ctx.outputs.task_id }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS }}
          MODELS_PRIMARY: ${{ vars.MODELS_PRIMARY }}
          MODELS_FALLBACK: ${{ vars.MODELS_FALLBACK }}
          EMBEDDINGS_MODEL: ${{ vars.EMBEDDINGS_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOCALE: es
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Havana' }}
        run: node src/runner.js

      - name: Trigger devil (abogado del diablo post-handoff)
        if: success()
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ steps.ctx.outputs.task_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const taskId = process.env.TASK_ID;
            if (!taskId) throw new Error('TASK_ID no definido');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'devil.yml',
              ref: 'main',
              inputs: { task_id: taskId }
            });

      - name: Trigger learner (post-mortem si la tarea está cerrada)
        if: success()
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ steps.ctx.outputs.task_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const taskId = process.env.TASK_ID;
            if (!taskId) throw new Error('TASK_ID no definido');
            // Validar formato TASK-XXXX para prevenir path traversal
            if (!/^TASK-\d{4,}$/.test(taskId)) {
              throw new Error(`task_id con formato inválido: ${taskId}`);
            }
            const taskPath = `tasks/${taskId}.json`;
            if (fs.existsSync(taskPath)) {
              const task = JSON.parse(fs.readFileSync(taskPath, 'utf8'));
              if (task.status === 'completed' || task.status === 'stuck') {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'learner.yml',
                  ref: 'main',
                  inputs: { task_id: task.id }
                });
              }
            }

      - name: Trigger budget (snapshot post-turno)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'budget-watch.yml',
              ref: 'main'
            });

      - name: Commit memory + tasks
        if: always()
        env:
          AGENT_NAME: ${{ steps.ctx.outputs.agent }}
          TASK_ID: ${{ steps.ctx.outputs.task_id }}
        run: |
          # Validar formato para prevenir inyección en git config / commit message
          if ! echo "$AGENT_NAME" | grep -qE '^[a-z_]+$'; then
            echo "ERROR: AGENT_NAME inválido: $AGENT_NAME"
            exit 1
          fi
          if ! echo "$TASK_ID" | grep -qE '^TASK-[0-9]+$'; then
            echo "ERROR: TASK_ID inválido: $TASK_ID"
            exit 1
          fi
          git config user.name  "agent-$AGENT_NAME"
          git config user.email "agent@bot"
          git add memory/ tasks/
          git diff --staged --quiet || git commit -m "mem: $TASK_ID por $AGENT_NAME"
          # Reintentar push hasta 3 veces si hay conflictos de rebase
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              if git push; then
                exit 0
              fi
            fi
            echo "⚠ intento $i falló, reintentando en ${i}s..."
            sleep $((i * 2))
          done
          echo "✗ no se pudo pushear tras 3 intentos"
          exit 1
