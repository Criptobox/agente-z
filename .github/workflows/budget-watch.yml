# .github/workflows/budget-watch.yml
# Vigila la cuota gratis de tokens y minutos.
# Corre cada hora + tras cada turno de agente (lo triggerea agent-run.yml).

name: budget-watch

on:
  schedule:
    # Cada hora en punto
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  models: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run budget agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUDGET_DAILY_TOKENS: ${{ vars.BUDGET_DAILY_TOKENS }}
          BUDGET_DAILY_ACTIONS_MINUTES: ${{ vars.BUDGET_DAILY_ACTIONS_MINUTES }}
          BUDGET_WARN_PERCENT: ${{ vars.BUDGET_WARN_PERCENT || '80' }}
          LOCALE: es
        run: node src/agents/budget.js

      - name: Commit
        run: |
          git config user.name  "agent-budget"
          git config user.email "agent@bot"
          git add memory/ tasks/
          git diff --staged --quiet || git commit -m "budget: snapshot horario"
          git push
