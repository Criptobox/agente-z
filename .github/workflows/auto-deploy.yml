# .github/workflows/auto-deploy.yml
# Auto-despliega el dashboard a GitHub Pages en cada push a main.
# No requiere reindex — solo copia los archivos estáticos + datos existentes.

name: auto-deploy

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'memory/**'
      - 'tasks/**'
      - 'src/**'
      - 'agents/**'
      - '.github/workflows/auto-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site artifact
        run: |
          mkdir -p ./_site
          # Dashboard a la raíz
          cp -r ./dashboard/* ./_site/
          # Datos para que el dashboard haga fetch
          mkdir -p ./_site/data/memory ./_site/data/tasks
          [ -f ./memory/index.json ] && cp ./memory/index.json ./_site/data/memory/
          [ -f ./memory/stats.json ] && cp ./memory/stats.json ./_site/data/memory/
          [ -f ./memory/vectors.json ] && cp ./memory/vectors.json ./_site/data/memory/
          [ -d ./memory/diary ] && cp -r ./memory/diary ./_site/data/memory/ 2>/dev/null || true
          [ -d ./memory/budget ] && cp -r ./memory/budget ./_site/data/memory/ 2>/dev/null || true
          [ -d ./tasks ] && cp ./tasks/*.json ./_site/data/tasks/ 2>/dev/null || true
          # Generar tasks/index.json si no existe
          if [ ! -f ./_site/data/tasks/index.json ]; then
            node -e "
              const fs = require('fs');
              const path = require('path');
              const dir = './tasks';
              const tasks = [];
              if (fs.existsSync(dir)) {
                for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.json') && f !== 'index.json')) {
                  try {
                    const t = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                    tasks.push({ id: t.id, status: t.status, project: t.project, goal: t.goal });
                  } catch {}
                }
              }
              fs.writeFileSync('./_site/data/tasks/index.json', JSON.stringify({ tasks, generatedAt: new Date().toISOString() }, null, 2));
            "
          fi
          echo "=== Artifact contenido ==="
          find ./_site -type f | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
