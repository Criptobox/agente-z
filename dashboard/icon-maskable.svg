<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Brain centered in safe zone (80% of canvas) -->
  <g transform="translate(256, 256) scale(0.7)">
    <circle cx="0" cy="0" r="40" fill="url(#brainGrad)"/>
    <circle cx="-110" cy="-70" r="22" fill="#58a6ff" opacity="0.9"/>
    <circle cx="110" cy="-70" r="22" fill="#bc8cff" opacity="0.9"/>
    <circle cx="-110" cy="70" r="22" fill="#3fb950" opacity="0.9"/>
    <circle cx="110" cy="70" r="22" fill="#d29922" opacity="0.9"/>
    <circle cx="0" cy="-130" r="18" fill="#f85149" opacity="0.9"/>
    <circle cx="0" cy="130" r="18" fill="#58a6ff" opacity="0.9"/>
    <g stroke="url(#brainGrad)" stroke-width="3" fill="none" opacity="0.6">
      <line x1="0" y1="0" x2="-110" y2="-70"/>
      <line x1="0" y1="0" x2="110" y2="-70"/>
      <line x1="0" y1="0" x2="-110" y2="70"/>
      <line x1="0" y1="0" x2="110" y2="70"/>
      <line x1="0" y1="0" x2="0" y2="-130"/>
      <line x1="0" y1="0" x2="0" y2="130"/>
    </g>
  </g>
</svg>
